<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سواقين التريلات</title><meta name="theme-color" content="#14346b">
<meta property="og:title" content="سواقين التريلات"><meta property="og:description" content="مجتمع سائقي التريلات وأصحاب العربيات: دردشة وعروض وفرص شغل"><meta property="og:type" content="website">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mut:#5b6784;--pri:#14346b;--acc:#f77f00;--bd:#d9dfec}
@media(prefers-color-scheme:dark){:root{--bg:#0d1526;--card:#16223d;--tx:#eef2fb;--mut:#9aa7c7;--pri:#4f7de0;--bd:#2a3a5f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.6 system-ui,Tahoma,sans-serif;padding-bottom:80px}
header{background:var(--pri);color:#fff;padding:14px 16px;font-size:22px;font-weight:700;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between}
header a,header span{font-size:15px;color:#fff;cursor:pointer}
main{max-width:640px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0 10px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 18px;background:var(--acc);color:#fff;min-height:52px;cursor:pointer}
button.sec{background:var(--pri)}button.bad{background:#c0392b}button.ok{background:#1e8e3e}button.ghost{background:none;color:var(--mut);min-height:36px;padding:4px 8px;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:15px;padding:10px 2px}nav button.on{color:var(--acc)}
.msg{padding:8px 12px;border-radius:12px;background:var(--bg);margin:6px 0;max-width:88%}.msg.me{background:var(--pri);color:#fff;margin-right:auto}
.msg small{display:block;opacity:.7;font-size:13px}.tag{display:inline-block;font-size:14px;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--bd)}
.mut{color:var(--mut);font-size:15px}#cb{max-height:48vh;overflow-y:auto}
</style></head><body>
<header><div>🚛 سواقين التريلات</div><div id="hr"></div></header>
<main id="app"></main><nav id="nav"></nav>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,query,where,limit,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== 1) الصق إعدادات مشروعك من Firebase هنا ====== */
const firebaseConfig={apiKey:"AIzaSyDECifkKZU3Egnbr3J534vYdtr8PTLDy1k",authDomain:"truckers-community.firebaseapp.com",projectId:"truckers-community",storageBucket:"truckers-community.firebasestorage.app",messagingSenderId:"1030144683929",appId:"1:1030144683929:web:69336302ebca99746fed08"};
/* ==================================================== */

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const CATS=["قطع غيار","إطارات","معدات","شحنة فاضية","فرصة شغل","خدمات","عربية للبيع","عربية للإيجار","مطلوب سائق","أخرى"];
const ROOMS=["عام","السعودية","مصر","الخليج","شغل وشحنات","ورشة وأعطال"];
const BAD=["كلب","حمار"]; // أضف كلمات المنع
const clean=s=>BAD.reduce((a,w)=>a.split(w).join("***"),s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const RT=r=>r==="owner"?"🚚 صاحب عربية":"🧑‍✈️ سائق";
let me=null,prof=null,admin=false,tab="chat",room="عام",fc="",fq="",unsubs=[],D={msgs:[],offers:[],mine:[],pend:[],reps:[]},mode="in";

onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];me=u;
  if(!u){prof=null;admin=false;return view()}
  prof=(await getDoc(doc(db,"users",u.uid))).data()||null;
  admin=(await getDoc(doc(db,"admins",u.uid)).catch(()=>null))?.exists()||false;
  const sub=(q,k)=>unsubs.push(onSnapshot(q,s=>{D[k]=s.docs.map(d=>({id:d.id,...d.data()}));if(tab!=="x")view(true)},e=>console.warn(k,e.code)));
  sub(query(collection(db,"chat"),where("room","==",room),limit(80)),"msgs");
  sub(query(collection(db,"offers"),where("status","==","approved"),limit(100)),"offers");
  sub(query(collection(db,"offers"),where("uid","==",u.uid)),"mine");
  if(admin){sub(query(collection(db,"offers"),where("status","==","pending")),"pend");sub(query(collection(db,"reports"),limit(50)),"reps")}
  view();
});

function nav(){const t=[["chat","💬","الدردشة"],["offers","🛒","العروض"],["mine","📝","عروضي"]];
  if(admin)t.push(["admin","🛡️","المراجعة ("+D.pend.length+")"]);
  $("nav").innerHTML=me&&prof?t.map(([k,i,l])=>`<button data-k="${k}" class="${tab===k?"on":""}">${i}<br>${l}</button>`).join(""):"";
  $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.k;view()});
  $("hr").innerHTML=me?`<span id="out">خروج</span>`:"";if(me)$("out").onclick=()=>signOut(auth)}

function view(keep){
  nav();const a=$("app");
  if(!me){return authView(a)}
  if(!prof){return profView(a)}
  const t=$("txt")?.value;a.innerHTML="";({chat:vChat,offers:vOffers,mine:vMine,admin:vAdmin})[tab](a);
  if(t&&$("txt"))$("txt").value=t;const cb=$("cb");if(cb)cb.scrollTop=cb.scrollHeight}

function authView(a){
  a.innerHTML=`<div class="card"><b>${mode==="in"?"تسجيل الدخول":"حساب جديد"}</b>
  <input id="em" type="email" placeholder="الإيميل"><input id="pw" type="password" placeholder="كلمة السر (6 حروف على الأقل)">
  <button id="go" class="sec" style="width:100%">${mode==="in"?"دخول":"إنشاء حساب"}</button>
  <p class="mut" id="er"></p><button class="ghost" id="sw">${mode==="in"?"مفيش عندي حساب":"عندي حساب"}</button></div>`;
  $("sw").onclick=()=>{mode=mode==="in"?"up":"in";view()};
  $("go").onclick=async()=>{try{const f=mode==="in"?signInWithEmailAndPassword:createUserWithEmailAndPassword;await f(auth,$("em").value.trim(),$("pw").value)}catch(e){$("er").textContent="خطأ: "+e.code}}}

function profView(a){
  a.innerHTML=`<div class="card"><b>أكمل بياناتك</b><input id="nm" placeholder="الاسم / اسم الشهرة"><input id="ct" placeholder="المدينة">
  <select id="rt"><option value="driver">🧑‍✈️ سائق</option><option value="owner">🚚 صاحب عربية / شركة</option></select>
  <button id="sv" class="sec" style="width:100%">حفظ</button></div>`;
  $("sv").onclick=async()=>{const name=clean($("nm").value.trim());if(!name)return;
    const p={name,city:$("ct").value.trim(),role:$("rt").value};await setDoc(doc(db,"users",me.uid),p);prof=p;view()}}

function vChat(a){
  const ms=D.msgs.sort((x,y)=>x.ts-y.ts).map(m=>`<div class="msg ${m.uid===me.uid?"me":""}"><small>${esc(m.name)} • ${RT(m.rt)}</small>${esc(m.text)}</div>`).join("")||'<div class="mut">ابدأ الكلام 👋</div>';
  a.innerHTML=`<div class="card"><select id="rm">${ROOMS.map(r=>`<option ${r===room?"selected":""}>${r}</option>`).join("")}</select><div id="cb">${ms}</div>
  <div class="row"><input id="txt" placeholder="اكتب رسالتك" style="flex:3"><button id="snd">إرسال</button></div></div>`;
  $("rm").onchange=e=>{room=e.target.value;resub()};
  const send=async()=>{const v=clean($("txt").value.trim());if(!v)return;$("txt").value="";
    try{await addDoc(collection(db,"chat"),{room,uid:me.uid,name:prof.name,rt:prof.role,text:v.slice(0,500),ts:Date.now()})}catch(e){alert("تعذر الإرسال (قد تكون محظورًا)")}};
  $("snd").onclick=send;$("txt").onkeydown=e=>{if(e.key==="Enter")send()}}
function resub(){unsubs.forEach(f=>f());unsubs=[];
  const u=auth.currentUser;if(!u)return;const sub=(q,k)=>unsubs.push(onSnapshot(q,s=>{D[k]=s.docs.map(d=>({id:d.id,...d.data()}));view(true)}));
  sub(query(collection(db,"chat"),where("room","==",room),limit(80)),"msgs");
  sub(query(collection(db,"offers"),where("status","==","approved"),limit(100)),"offers");
  sub(query(collection(db,"offers"),where("uid","==",u.uid)),"mine");
  if(admin){sub(query(collection(db,"offers"),where("status","==","pending")),"pend");sub(query(collection(db,"reports"),limit(50)),"reps")}}

function vOffers(a){
  a.innerHTML=`<div class="card row"><select id="fc"><option value="">كل التصنيفات</option>${CATS.map(c=>`<option ${c===fc?"selected":""}>${c}</option>`).join("")}</select><input id="fq" placeholder="بحث" value="${esc(fq)}"></div><div id="ol"></div>`;
  $("fc").onchange=e=>{fc=e.target.value;view()};$("fq").onchange=e=>{fq=e.target.value;view()};
  const l=D.offers.filter(o=>(!fc||o.cat===fc)&&(!fq||(o.title+o.desc+o.city).includes(fq))).sort((x,y)=>y.ts-x.ts);
  $("ol").innerHTML=l.map(o=>`<div class="card"><b>${esc(o.title)}</b> <span class="tag">${esc(o.cat)}</span><div>${esc(o.desc)}</div>
  <div class="mut">📍 ${esc(o.city)} ${o.price?"• 💰 "+esc(o.price):""} • 👤 ${esc(o.name)} (${RT(o.rt)})</div>
  <div class="row" style="margin-top:8px"><a href="tel:${esc(o.phone)}" style="flex:3"><button class="ok" style="width:100%">📞 ${esc(o.phone)}</button></a><button class="ghost" data-r="${o.id}">🚩 تبليغ</button></div></div>`).join("")||'<div class="card mut">مفيش عروض منشورة.</div>';
  $("ol").querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{await addDoc(collection(db,"reports"),{offer:b.dataset.r,by:me.uid,ts:Date.now()});b.textContent="تم ✓"})}

function vMine(a){
  a.innerHTML=`<div class="card"><b>إضافة عرض جديد</b><input id="t" placeholder="عنوان العرض"><textarea id="d" rows="3" placeholder="الوصف"></textarea>
  <select id="c">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><div class="row"><input id="ci" placeholder="المدينة" value="${esc(prof.city)}"><input id="p" placeholder="السعر (اختياري)"></div>
  <input id="ph" type="tel" placeholder="رقم التواصل"><button id="go" style="width:100%">إرسال للمراجعة</button><p class="mut">العرض مش هيظهر إلا بعد موافقة الإدارة.</p></div><div id="ml"></div>`;
  const ST={pending:"⏳ قيد المراجعة",approved:"✅ منشور",rejected:"❌ مرفوض"};
  $("ml").innerHTML=D.mine.sort((x,y)=>y.ts-x.ts).map(o=>`<div class="card"><b>${esc(o.title)}</b><div>${ST[o.status]}</div>${o.reason?`<div class="mut">السبب: ${esc(o.reason)}</div>`:""}<button class="ghost" data-d="${o.id}">🗑 حذف</button></div>`).join("");
  $("ml").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>confirm("حذف العرض؟")&&deleteDoc(doc(db,"offers",b.dataset.d)));
  $("go").onclick=async()=>{const g=i=>clean($(i).value.trim());const o={title:g("t"),desc:g("d"),cat:$("c").value,city:g("ci"),price:g("p"),phone:g("ph"),uid:me.uid,name:prof.name,rt:prof.role,ts:Date.now(),status:"pending",reason:""};
    if(!o.title||!o.phone||!o.city)return alert("اكتب العنوان والمدينة والرقم");
    try{await addDoc(collection(db,"offers"),o);tab="mine";view()}catch(e){alert("تعذر الإرسال")}}}

function vAdmin(a){
  a.innerHTML=(D.pend.length?"":'<div class="card mut">مفيش عروض منتظرة 🎉</div>')+D.pend.map(o=>`<div class="card" data-o="${o.id}"><b>${esc(o.title)}</b> <span class="tag">${esc(o.cat)}</span><div>${esc(o.desc)}</div>
  <div class="mut">📍 ${esc(o.city)} • ${esc(o.price)} • 📞 ${esc(o.phone)} • 👤 ${esc(o.name)}</div><input placeholder="سبب الرفض"><div class="row"><button class="ok" data-a="1">قبول</button><button class="bad" data-a="0">رفض</button><button class="ghost" data-b="${o.uid}">حظر</button></div></div>`).join("")
  +`<div class="card"><b>البلاغات (${D.reps.length})</b>${D.reps.map(r=>`<div class="mut">عرض: ${esc(r.offer)} <button class="ghost" data-x="${r.id}">إغلاق</button> <button class="ghost" data-del="${r.offer}">حذف العرض</button></div>`).join("")}</div>`;
  a.querySelectorAll("[data-o]").forEach(c=>{const id=c.dataset.o,inp=c.querySelector("input");
    c.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>updateDoc(doc(db,"offers",id),b.dataset.a==="1"?{status:"approved"}:{status:"rejected",reason:inp.value||"غير مناسب"}));
    c.querySelector("[data-b]").onclick=e=>confirm("حظر المستخدم؟")&&setDoc(doc(db,"bans",e.target.dataset.b),{ts:Date.now()})});
  a.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>deleteDoc(doc(db,"reports",b.dataset.x)));
  a.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteDoc(doc(db,"offers",b.dataset.del)))}
</script></body></html>
